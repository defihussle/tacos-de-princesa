name = "tacos-de-princesa"
compatibility_date = "2024-01-01"

# Handles /api/* (online ordering); everything else is a static file
main = "worker/index.js"

# The whole site is static files at the repo root (.assetsignore lists what
# isn't published)
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Clover settings that aren't secret (the merchant ID is also in js/order.js).
# SANDBOX values. For the live merchant: CLOVER_ENV = "production", its
# merchant ID and HST tax rate ID, and CLOVER_CURRENCY = "cad" (the sandbox
# test merchant only accepts USD).
#
# The one secret, never in this file: CLOVER_PRIVATE_TOKEN, the merchant's
# private Ecommerce API token. Previews and the live Worker keep secrets
# separately (preview: Preview base config / `wrangler preview secret`;
# live: Settings > Variables and Secrets).
# Optional: CLOVER_ORDER_TYPE_ID, an order type such as "Online Pickup".
[vars]
CLOVER_ENV = "sandbox"
CLOVER_MERCHANT_ID = "2N9FRNJANSV31"
CLOVER_TAX_RATE_ID = "CTEF4PB5MHX8A" # sandbox "HST" 13%
CLOVER_CURRENCY = "usd"

# Needed by `npx wrangler preview` (the deploy command for preview builds)
[previews]
