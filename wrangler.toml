name = "tacos-de-princesa"
compatibility_date = "2026-11-01"

# Handles /api/* (online ordering); everything else is a static file
main = "worker/index.js"

# Production answers only at tacosprincesa.ca, not at a workers.dev address.
# preview_urls keeps branch previews (and version preview URLs) working,
# since they'd otherwise follow workers_dev. Livetest keeps its own
# workers.dev address (below).
workers_dev = false
preview_urls = true

# The whole site is static files at the repo root (.assetsignore lists what
# isn't published)
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers Logs: console output of every request, searchable in the
# dashboard (Workers > the Worker > Logs). Per order:
#   ORDER <orderId> store=<store> amount=<cents>
#   PRINT SENT <orderId> ... job <id>, then PRINTED <orderId> ...
#   PRINT FAILED <orderId> ... (refused, failed, or not printed in time)
#   ALERT SENT / ALERT FAILED / ALERT NOT SENT (the "didn't print" email)
[observability]
enabled = true

# Per-IP rate limiter (worker/ratelimit.js). SQLite-backed, so it runs on the
# Workers Free plan. Previews and livetest get their own binding below (bindings
# aren't shared); the migration creates the class once per Worker.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[previews.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ---------------------------------------------------------------------------
# Settings (what each one means: top of worker/index.js; going live:
# docs/go-live.md). Three places, each with its own copy:
#   [vars]                 the production Worker (deployed from main)
#   [previews.vars]        Preview builds of other branches: SANDBOX only
#   [env.livetest.vars]    the private live test Worker (below)
# Per-store values: add the store suffix to override the shared one, e.g.
# CLOVER_MERCHANT_ID_ONE_YORK. Secrets are never in this file: the private
# token is CLOVER_PRIVATE_TOKEN (or CLOVER_PRIVATE_TOKEN_ONE_YORK ...), set
# in the dashboard (production: Settings > Variables and Secrets; previews:
# Settings > Previews base config, or `wrangler preview secret put`).
# ---------------------------------------------------------------------------

# "Order didn't print" emails: the send_email binding ALERT_EMAIL. Each
# address in ALERT_EMAILS must be a verified destination in Email Routing for
# tacosprincesa.ca, and ALERT_FROM an address on tacosprincesa.ca (go-live
# docs). Previews and livetest need their own copy (bindings aren't shared).
[[send_email]]
name = "ALERT_EMAIL"

[[previews.send_email]]
name = "ALERT_EMAIL"

# PRODUCTION. Ordering stays OFF until launch; these Clover values are still
# the SANDBOX ones and must be replaced (docs/go-live.md).
[vars]
ORDERING_OPEN = "false"
STORES_ENABLED = "one-york"
CLOSED_DATES = ""          # one-off closures, e.g. "2026-12-31" (holidays are automatic: worker/hours.js)
ALERT_EMAILS = "omer@narcostacos.ca"   # comma-separated
ALERT_FROM = "alerts@tacosprincesa.ca"
CLOVER_ENV = "sandbox"
CLOVER_CURRENCY = "usd"
CLOVER_MERCHANT_ID = "2N9FRNJANSV31"
CLOVER_PUBLIC_KEY = "b1115fedbe960f0ef8b1fa3b443a3b96"
CLOVER_TAX_RATE_ID = "CTEF4PB5MHX8A"
# Bot / card-tester defences (all tunable). Turnstile: the site key is public;
# set TURNSTILE_SECRET in the dashboard (Settings > Variables and Secrets),
# NEVER here. Production refuses Turnstile TEST keys.
TURNSTILE_SITE_KEY = ""     # production Turnstile site key (real 0x... widget)
HEALTH_TOKEN = ""           # set in the dashboard to read the DETAILED /api/health in production (x-health-token header)
RATE_ORDER_LIMIT = "20"     # orders per IP per RATE_ORDER_WINDOW_S (generous: shared PATH IPs)
RATE_ORDER_WINDOW_S = "60"
RATE_FAIL_LIMIT = "5"       # failed payments per IP per RATE_FAIL_WINDOW_S (strict: card testers)
RATE_FAIL_WINDOW_S = "600"

# PREVIEWS (`npx wrangler preview`, the deploy command for preview builds)
# don't inherit [vars]. Always the sandbox test merchant (USD only), so
# previews never charge real cards.
[previews.vars]
ORDERING_OPEN = "true"
STORES_ENABLED = "one-york"
CLOSED_DATES = ""
ALERT_EMAILS = "omer@narcostacos.ca"
ALERT_FROM = "alerts@tacosprincesa.ca"
CLOVER_ENV = "sandbox"
CLOVER_CURRENCY = "usd"
CLOVER_MERCHANT_ID = "2N9FRNJANSV31"
CLOVER_PUBLIC_KEY = "b1115fedbe960f0ef8b1fa3b443a3b96"
CLOVER_TAX_RATE_ID = "CTEF4PB5MHX8A" # sandbox "HST" 13%
# Turnstile TEST keys (Cloudflare's documented dummy keys: always pass,
# invisible). Public values, safe here; previews are sandbox-only.
TURNSTILE_SITE_KEY = "1x00000000000000000000BB"
TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"
RATE_ORDER_LIMIT = "20"
RATE_ORDER_WINDOW_S = "60"
RATE_FAIL_LIMIT = "5"
RATE_FAIL_WINDOW_S = "600"

# PRIVATE LIVE TEST: a separate Worker, tacos-de-princesa-livetest, on its
# workers.dev address only (no custom domain), with the restaurant's LIVE
# Clover settings, to place real low-value orders before launch.
#   Deploy:  npx wrangler deploy --env livetest
#   Secret:  npx wrangler secret put CLOVER_PRIVATE_TOKEN --env livetest
#            (the live private token; never shared with the other Workers)
# Cloudflare Access will be put in front of its workers.dev address later,
# so only the team can open it. Until then, keep ORDERING_OPEN = "false"
# except while testing.
[env.livetest]
name = "tacos-de-princesa-livetest"
workers_dev = true

[env.livetest.assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[env.livetest.observability]
enabled = true

[[env.livetest.send_email]]
name = "ALERT_EMAIL"

[[env.livetest.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.livetest.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[env.livetest.vars]
ORDERING_OPEN = "false"
STORES_ENABLED = "one-york"
CLOSED_DATES = ""
ALERT_EMAILS = "omer@narcostacos.ca"
ALERT_FROM = "alerts@tacosprincesa.ca"
CLOVER_ENV = "production"
CLOVER_CURRENCY = "cad"
CLOVER_MERCHANT_ID = ""    # live merchant ID
CLOVER_PUBLIC_KEY = ""     # live public (Ecommerce) key
CLOVER_TAX_RATE_ID = ""    # live HST 13% tax rate ID
CLOVER_ORDER_TYPE_ID = ""  # live order type "Website Pick Up 1 York" (DR9JRZ31WB6Y4); required in production
TURNSTILE_SITE_KEY = ""    # livetest Turnstile site key (real 0x... widget); set TURNSTILE_SECRET in the dashboard
RATE_ORDER_LIMIT = "20"
RATE_ORDER_WINDOW_S = "60"
RATE_FAIL_LIMIT = "5"
RATE_FAIL_WINDOW_S = "600"
