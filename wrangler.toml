name = "tacos-de-princesa"
compatibility_date = "2024-01-01"

# Handles /api/* (online ordering); everything else is a static file
main = "worker/index.js"

# The whole site is static files at the repo root (.assetsignore lists what
# isn't published)
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Clover settings that aren't secret (the merchant ID is also in js/order.js).
# These are SANDBOX values (the sandbox test merchant only accepts USD).
#
# GOING LIVE, change [vars] below to the restaurant's live Clover merchant:
#   CLOVER_ENV         = "production"
#   CLOVER_MERCHANT_ID = the live merchant ID
#   CLOVER_TAX_RATE_ID = the live merchant's HST 13% tax rate ID
#   CLOVER_CURRENCY    = "cad"
# and also (full checklist at the top of worker/index.js):
#   - Cloudflare: Workers > tacos-de-princesa > Settings > Variables and
#     Secrets > CLOVER_PRIVATE_TOKEN = the live private token (type Secret)
#   - js/order.js CONFIG.clover: the live public token and merchant ID
#   - order.html: Clover SDK https://checkout.clover.com/sdk.js
# Keep [previews.vars] on the sandbox so previews never charge real cards.
#
# The one secret, never in this file: CLOVER_PRIVATE_TOKEN, the merchant's
# private Ecommerce API token. Previews and the live Worker keep secrets
# separately (preview: Preview base config / `wrangler preview secret`;
# live: Settings > Variables and Secrets).
# Optional: CLOVER_ORDER_TYPE_ID, an order type such as "Online Pickup".
[vars]
CLOVER_ENV = "sandbox"
CLOVER_MERCHANT_ID = "2N9FRNJANSV31"
CLOVER_TAX_RATE_ID = "CTEF4PB5MHX8A" # sandbox "HST" 13%
CLOVER_CURRENCY = "usd"

# Previews (`npx wrangler preview`, the deploy command for preview builds)
# don't inherit [vars]: they need their own copy here. Preview secrets come
# from Settings > Previews Base (copied into each NEW Preview when it's
# created) or `wrangler preview secret put`.
[previews.vars]
CLOVER_ENV = "sandbox"
CLOVER_MERCHANT_ID = "2N9FRNJANSV31"
CLOVER_TAX_RATE_ID = "CTEF4PB5MHX8A"
CLOVER_CURRENCY = "usd"
